global
    log stdout format raw local0
    maxconn 256

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5s
    timeout client  30s
    timeout server  30s
    option  httpchk
    http-check send meth GET uri /api/health
    http-check expect status 200

frontend http-in
    bind *:80
    default_backend web_backends

backend web_backends
    balance roundrobin
    option httpchk GET /api/health
    default-server inter 3s fall 3 rise 2
    server web01 web-01:3000 check
    server web02 web-02:3000 check