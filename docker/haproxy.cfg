global
    log stdout format raw local0
    maxconn 256

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  redispatch
    retries 2
    timeout connect 1s
    timeout client  30s
    timeout server  30s
    timeout check   1s

frontend http-in
    bind *:80
    default_backend web_backends

backend web_backends
    balance roundrobin
    option httpchk GET /api/health
    http-check expect status 200
    default-server inter 1s fall 2 rise 2
    server web01 web-01:3000 check
    server web02 web-02:3000 check
